services:
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: always
    networks:
      backend:
        ipv4_address: 172.28.0.20

  nginx1:
    image: nginx:alpine
    container_name: nginx1
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    networks:
      backend:
        ipv4_address: 172.28.0.11
    depends_on:
      - whoami

  nginx2:
    image: nginx:alpine
    container_name: nginx2
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8082:80"
    networks:
      backend:
        ipv4_address: 172.28.0.12
    depends_on:
      - whoami

  nginx3:
    image: nginx:alpine
    container_name: nginx3
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8083:80"
    networks:
      backend:
        ipv4_address: 172.28.0.13
    depends_on:
      - whoami

  nginx4:
    image: nginx:alpine
    container_name: nginx4
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8084:80"
    networks:
      backend:
        ipv4_address: 172.28.0.14
    depends_on:
      - whoami

networks:
  backend:
    name: devops-test-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
