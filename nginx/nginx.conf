worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # свои nginx по IP. docker gateway не в списке - через него идет клиентский трафик.
    geo $is_trusted_proxy {
        default     0;
        172.28.0.11 1;
        172.28.0.12 1;
        172.28.0.13 1;
        172.28.0.14 1;
    }

    map $is_trusted_proxy $xff_value {
        0  $remote_addr;
        1  $proxy_add_x_forwarded_for;
    }

    log_format chain '$time_iso8601 | $hostname | from=$remote_addr trusted=$is_trusted_proxy '
                     '| in_xff="$http_x_forwarded_for" out_xff="$xff_value" '
                     '| "$request"';
    access_log /var/log/nginx/access.log chain;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80 default_server;
        server_name _;

        location = /app {
            proxy_set_header X-Forwarded-For $xff_value;
            proxy_pass http://whoami:80/;
        }

        location /via/nginx1/ {
            proxy_set_header X-Forwarded-For $xff_value;
            proxy_pass http://nginx1:80/;
        }
        location /via/nginx2/ {
            proxy_set_header X-Forwarded-For $xff_value;
            proxy_pass http://nginx2:80/;
        }
        location /via/nginx3/ {
            proxy_set_header X-Forwarded-For $xff_value;
            proxy_pass http://nginx3:80/;
        }
        location /via/nginx4/ {
            proxy_set_header X-Forwarded-For $xff_value;
            proxy_pass http://nginx4:80/;
        }
    }
}
